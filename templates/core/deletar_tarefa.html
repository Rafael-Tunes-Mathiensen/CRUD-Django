<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Excluir Tarefa</title>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mt-5">Excluir Tarefa</h1>
        <p class="text-center">Tem certeza que deseja excluir a tarefa"?</p>
        <p class="text-center">
            <strong>Id:</strong> {{ tarefa.id }}<br>
            <strong>Titulo:</strong> {{ tarefa.titulo }}<br>
            <strong>Descrição:</strong> {{ tarefa.descricao }}<br>
            <strong>Status:</strong> {% if tarefa.status %} Concluída {% else %} Pendente {% endif %}
        </p>
        <form method="POST" action="">
            {% csrf_token %}
            <div class="d-flex justify-content-center gap-2">
                <button type="submit" class="btn btn-danger">Excluir</button>
                <a class="btn btn-secondary" href="{% url 'tarefas' %}">Cancelar</a>
            </div>
        </form>
    </div>
</body>
</html>
